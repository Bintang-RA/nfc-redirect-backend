<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NFC Master Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-app: #eef0f4;
      --bg-card: #ffffff;
      --bg-input: #f4f5f8;
      --text-main: #0f172a;
      --text-muted: #8c94a0;
      --accent-dark: #111827;
      --accent-hover: #1f2937;
      --border-color: #e5e7eb;
      --shadow-soft: 0 20px 40px rgba(0, 0, 0, 0.04), 0 1px 3px rgba(0,0,0,0.02);
      --radius-lg: 28px;
      --radius-md: 16px;
      --radius-sm: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-app);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .app-window {
      width: 100%;
      max-width: 840px;
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 36px;
      box-shadow: var(--shadow-soft);
      border: 1px solid rgba(255,255,255,0.8);
      transition: all 0.3s ease;
    }

    /* LOGIN */
    .login-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 10px;
      text-align: center;
    }

    .login-badge {
      width: 60px;
      height: 60px;
      background: var(--accent-dark);
      color: #ffffff;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 24px;
      box-shadow: 0 12px 24px rgba(17, 24, 39, 0.2);
    }

    .login-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: var(--accent-dark);
      margin-bottom: 6px;
    }

    .login-subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 32px;
      font-weight: 500;
    }

    .login-box {
      width: 100%;
      max-width: 360px;
    }

    /* INPUTS & BUTTONS */
    .input-group {
      margin-bottom: 18px;
      text-align: left;
    }

    .input-label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .custom-input {
      width: 100%;
      padding: 14px 18px;
      font-size: 15px;
      font-weight: 500;
      background-color: var(--bg-input);
      border: 1.5px solid transparent;
      border-radius: var(--radius-md);
      color: var(--text-main);
      outline: none;
      transition: all 0.2s ease;
    }

    .custom-input:focus {
      background-color: #ffffff;
      border-color: var(--accent-dark);
      box-shadow: 0 0 0 4px rgba(17, 24, 39, 0.08);
    }

    .btn-dark {
      width: 100%;
      padding: 15px 20px;
      font-size: 15px;
      font-weight: 700;
      background-color: var(--accent-dark);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 10px 20px rgba(17, 24, 39, 0.15);
    }

    .btn-dark:hover {
      background-color: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-dark:active {
      transform: translateY(0);
    }

    /* DASHBOARD */
    .dash-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 24px;
      margin-bottom: 28px;
      border-bottom: 1px solid var(--border-color);
    }

    .dash-title-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .dash-icon {
      width: 44px;
      height: 44px;
      background: var(--accent-dark);
      color: #fff;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .dash-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .dash-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 500;
    }

    .btn-logout {
      padding: 9px 16px;
      font-size: 13px;
      font-weight: 700;
      background: #fef2f2;
      color: #ef4444;
      border: 1px solid #fee2e2;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-logout:hover {
      background: #fee2e2;
    }

    .section-card {
      background: #fafbfc;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 24px;
      margin-bottom: 28px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 18px;
      color: var(--accent-dark);
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .form-full {
      grid-column: span 2;
    }

    /* TABLE */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 8px;
      white-space: nowrap;
    }

    th {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      padding: 8px 16px;
      text-align: left;
    }

    td {
      background: #ffffff;
      padding: 14px 16px;
      font-size: 14px;
      border-top: 1px solid var(--border-color);
      border-bottom: 1px solid var(--border-color);
    }

    td:first-child {
      border-left: 1px solid var(--border-color);
      border-top-left-radius: var(--radius-sm);
      border-bottom-left-radius: var(--radius-sm);
      font-weight: 700;
      color: var(--accent-dark);
    }

    td:last-child {
      border-right: 1px solid var(--border-color);
      border-top-right-radius: var(--radius-sm);
      border-bottom-right-radius: var(--radius-sm);
    }

    .scan-badge {
      display: inline-block;
      padding: 5px 12px;
      background: var(--accent-dark);
      color: #ffffff;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }

    .link-action {
      color: var(--accent-dark);
      text-decoration: none;
      font-weight: 700;
      font-size: 13px;
    }

    .link-action:hover {
      text-decoration: underline;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 640px) {
      body {
        padding: 12px;
      }
      .app-window {
        padding: 24px 18px;
        border-radius: 20px;
      }
      .form-grid {
        grid-template-columns: 1fr;
      }
      .form-full {
        grid-column: span 1;
      }
      .dash-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
      }
      .btn-logout {
        align-self: flex-end;
      }
    }
  </style>
</head>
<body>

  <div class="app-window">
    
    <!-- LOGIN SCREEN -->
    <div id="loginCard" class="login-wrapper">
      <div class="login-badge">⚡</div>
      <h1 class="login-title">Control Portal</h1>
      <p class="login-subtitle">Masukkan password akses master admin</p>

      <div class="login-box">
        <div class="input-group">
          <label class="input-label" for="adminKey">Security Key</label>
          <input type="password" id="adminKey" class="custom-input" placeholder="••••••••••••">
        </div>
        <button class="btn-dark" onclick="loginAdmin()">Masuk Portal</button>
      </div>
    </div>

    <!-- DASHBOARD SCREEN -->
    <div id="dashboardSection" class="hidden">
      
      <div class="dash-header">
        <div class="dash-title-group">
          <div class="dash-icon">⚡</div>
          <div>
            <h2 class="dash-title">Master Dashboard</h2>
            <p class="dash-subtitle">NFC & QR Code Redirect Management</p>
          </div>
        </div>
        <button class="btn-logout" onclick="logoutAdmin()">Keluar</button>
      </div>

      <div class="section-card">
        <h3 class="section-title">➕ Set / Edit Link Alat</h3>
        
        <div class="form-grid">
          <div class="input-group">
            <label class="input-label">Kode Alat (ID)</label>
            <input type="text" id="idCode" class="custom-input" placeholder="Misal: A001">
          </div>

          <div class="input-group">
            <label class="input-label">Nama Klien / Kafe</label>
            <input type="text" id="clientName" class="custom-input" placeholder="Misal: Kopi Kenangan">
          </div>

          <div class="input-group form-full">
            <label class="input-label">URL Google Maps Baru</label>
            <input type="url" id="targetUrl" class="custom-input" placeholder="https://maps.app.goo.gl/...">
          </div>
        </div>

        <button class="btn-dark" style="margin-top: 10px;" onclick="saveDevice()">Simpan Link Alat</button>
      </div>

      <div>
        <h3 class="section-title">📊 Daftar Seluruh Alat</h3>
        
        <div class="table-responsive">
          <table>
            <thead>
              <tr>
                <th>ID Alat</th>
                <th>Nama Klien</th>
                <th>Total Scan</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="deviceTable">
              <!-- JS Content -->
            </tbody>
          </table>
        </div>
      </div>

    </div>

  </div>

  <script>
    let savedAdminKey = '';

    async function loginAdmin() {
      const key = document.getElementById('adminKey').value;
      if (!key) return alert('Masukkan password admin!');

      const res = await fetch('/api/admin/devices', { headers: { 'x-admin-key': key } });
      const json = await res.json();

      if (!json.success) {
        return alert(json.message || 'Password Salah!');
      }

      savedAdminKey = key;
      document.getElementById('loginCard').classList.add('hidden');
      document.getElementById('dashboardSection').classList.remove('hidden');
      renderTable(json.data);
    }

    function logoutAdmin() {
      savedAdminKey = '';
      document.getElementById('adminKey').value = '';
      document.getElementById('loginCard').classList.remove('hidden');
      document.getElementById('dashboardSection').classList.add('hidden');
    }

    async function loadDevices() {
      const res = await fetch('/api/admin/devices', { headers: { 'x-admin-key': savedAdminKey } });
      const json = await res.json();
      if (json.success) renderTable(json.data);
    }

    function renderTable(data) {
      const tbody = document.getElementById('deviceTable');
      if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:20px; color:#8c94a0;">Belum ada data alat.</td></tr>';
        return;
      }

      tbody.innerHTML = data.map(d => `
        <tr>
          <td>${d.idCode}</td>
          <td>${d.clientName || d.userId || '-'}</td>
          <td><span class="scan-badge">${d.scanCount || 0}x scan</span></td>
          <td><a href="${d.targetUrl}" target="_blank" class="link-action">Buka Maps ↗</a></td>
        </tr>
      `).join('');
    }

    async function saveDevice() {
      const idCode = document.getElementById('idCode').value;
      const clientName = document.getElementById('clientName').value;
      const targetUrl = document.getElementById('targetUrl').value;

      if (!idCode || !targetUrl) return alert('Kode Alat dan Link Google Maps wajib diisi!');

      const res = await fetch('/api/admin/update', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'x-admin-key': savedAdminKey },
        body: JSON.stringify({ idCode, clientName, targetUrl })
      });

      const json = await res.json();
      alert(json.message);
      
      if (json.success) {
        document.getElementById('idCode').value = '';
        document.getElementById('clientName').value = '';
        document.getElementById('targetUrl').value = '';
        loadDevices();
      }
    }
  </script>
</body>
</html>
